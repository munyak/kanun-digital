<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <defs>
    <linearGradient id="embrace-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B5B95"/>
      <stop offset="100%" stop-color="#4A9B94"/>
    </linearGradient>
  </defs>
  
  <!-- The Embrace Mark: Two curved forms creating protective enclosure -->
  <g transform="translate(8, 8)">
    <!-- Left embrace curve -->
    <path d="M22 2C10 2 2 12 2 24s8 22 20 22" 
          stroke="url(#embrace-grad)" 
          stroke-width="3.5" 
          stroke-linecap="round"
          fill="none"/>
    <!-- Right embrace curve -->
    <path d="M22 2c12 0 20 10 20 22s-8 22-20 22" 
          stroke="url(#embrace-grad)" 
          stroke-width="3.5" 
          stroke-linecap="round"
          fill="none"/>
    <!-- Center dot (what's being protected) -->
    <circle cx="22" cy="24" r="4" fill="url(#embrace-grad)"/>
  </g>
  
  <!-- Wordmark -->
  <text x="72" y="40" 
        font-family="Cormorant Garamond, Georgia, serif" 
        font-size="32" 
        font-weight="500" 
        fill="#1A1A1A"
        letter-spacing="-0.02em">
    <tspan>KaNun</tspan>
    <tspan fill="#6B5B95" font-weight="400"> Digital</tspan>
  </text>
</svg>
