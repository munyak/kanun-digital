<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f8fc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <radialGradient id="glow1" cx="25%" cy="25%" r="65%">
      <stop offset="0" stop-color="#5a3dff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5a3dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="75%" cy="35%" r="70%">
      <stop offset="0" stop-color="#0bb7aa" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0bb7aa" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#glow1)"/>
  <rect width="1600" height="1000" fill="url(#glow2)"/>

  <!-- soft abstract shapes (comfort / improvement / betterment) -->
  <g filter="url(#soft)" opacity="0.9">
    <path d="M260,720 C220,610 270,520 380,500 C510,476 590,585 560,700 C530,820 350,845 260,720 Z" fill="#5a3dff" opacity="0.14"/>
    <path d="M1040,210 C1120,130 1280,140 1370,260 C1460,380 1400,530 1250,560 C1100,590 980,450 990,330 C995,275 1010,240 1040,210 Z" fill="#0bb7aa" opacity="0.12"/>
    <path d="M790,740 C700,650 735,520 850,480 C970,440 1100,520 1090,650 C1080,795 915,845 790,740 Z" fill="#111827" opacity="0.06"/>
  </g>

  <!-- gentle lines -->
  <g opacity="0.20" stroke="#0a1020" stroke-width="2" fill="none">
    <path d="M140 840 C 420 760, 580 820, 820 720 C 1040 630, 1210 640, 1460 520"/>
    <path d="M160 250 C 410 330, 560 260, 760 330 C 950 395, 1110 360, 1440 420"/>
  </g>

  <!-- caption (subtle) -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter, Helvetica, Arial" fill="#0a1020" opacity="0.62">
    <text x="64" y="88" font-size="28" letter-spacing="2">KANUN DIGITAL</text>
    <text x="64" y="132" font-size="18">Comfort • Improvement • Betterment</text>
  </g>
</svg>
