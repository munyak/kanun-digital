      <stop offset="0" stop-color="#5a3dff"/>
      <stop offset="1" stop-color="#0bb7aa"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#5a3dff" flood-opacity="0.22"/>
