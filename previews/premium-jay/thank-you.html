<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thank You — Kanun Digital</title>
  <link rel="icon" href="../../brand/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FDFCFA;
      --text: #1A1A1A;
      --text-secondary: #5A5A5A;
      --accent: #6B5B95;
      --teal: #4A9B94;
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans: 'Inter', system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 48px;
    }
    .brand-mark {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--teal));
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-mark svg { width: 26px; height: 26px; }
    .brand-name {
      font-family: var(--serif);
      font-size: 28px;
      font-weight: 500;
    }
    .brand-name span { color: var(--accent); }
    
    .check-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--teal));
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 32px;
      box-shadow: 0 16px 48px rgba(107,91,149,.25);
    }
    .check-icon svg { width: 40px; height: 40px; color: #fff; }
    
    h1 {
      font-family: var(--serif);
      font-size: 42px;
      font-weight: 400;
      margin-bottom: 16px;
    }
    p {
      font-size: 18px;
      color: var(--text-secondary);
      max-width: 480px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 16px 32px;
      border-radius: 999px;
      background: var(--text);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: all .25s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(26,26,26,.2);
    }
  </style>
</head>
<body>
  <a href="index.html" class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 5v14"/>
        <path d="M8 12l7-7"/>
        <path d="M8 12l7 7"/>
        <circle cx="18" cy="18" r="2" fill="#FDFCFA" stroke="none" opacity="0.85"/>
      </svg>
    </div>
    <div class="brand-name">KaNun <span>Digital</span></div>
  </a>
  
  <div class="check-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 13l4 4L19 7"/>
    </svg>
  </div>
  
  <h1>Thank you</h1>
  <p>Your message has been received. We'll review your request and respond within 1-2 business days — sooner if you indicated urgency.</p>
  
  <a href="index.html" class="btn">← Back to Home</a>
</body>
</html>
